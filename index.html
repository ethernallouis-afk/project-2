<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CROSS & CROWN | Y2K Gothic Streetwear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0d0d0d; color: #e5e5e5; font-family: 'Montserrat', sans-serif; overflow-x: hidden; }

        header {
            background-color: #000;
            border-bottom: 1px solid #222;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo { font-family: 'UnifrakturMaguntia', cursive; font-size: 32px; color: #fff; letter-spacing: 2px; }
        nav { display: flex; align-items: center; gap: 15px; }
        
        .search-box {
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 6px 12px;
            font-size: 11px;
            border-radius: 4px;
            outline: none;
        }

        .currency-select { background: #000; color: #888; border: 1px solid #333; padding: 6px 8px; font-size: 11px; cursor: pointer; }
        
        .cart-trigger {
            background: #fff;
            color: #000;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            letter-spacing: 1px;
        }

        .hero {
            height: 40vh;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=1200&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            border-bottom: 1px solid #222;
        }

        .hero h1 { font-family: 'UnifrakturMaguntia', cursive; font-size: 48px; color: #fff; }
        .hero p { letter-spacing: 4px; font-size: 11px; text-transform: uppercase; color: #888; margin-top: 5px; }

        .container { padding: 40px 5%; max-width: 1300px; margin: 0 auto; }

        /* Filter Section */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 8px 18px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            border-color: #fff;
            color: #fff;
            background: #222;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: #111;
            border: 1px solid #222;
            padding: 15px;
            text-align: center;
            transition: border-color 0.3s;
        }

        .product-card:hover { border-color: #555; }

        .product-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            object-position: center;
            background-color: #1a1a1a;
            margin-bottom: 15px;
            border: 1px solid #222;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .product-img:hover { transform: scale(1.02); }
        .product-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; color: #fff; }
        .product-price { color: #888; font-size: 12px; margin-bottom: 15px; }

        .btn-buy {
            background-color: #fff;
            color: #000;
            border: none;
            padding: 10px 15px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }

        .btn-buy:hover { background-color: #333; color: #fff; }

        /* Modal Quick View & Cart Overlay */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .modal-content { 
            background: #111; 
            border: 1px solid #333; 
            padding: 25px; 
            max-width: 480px; 
            width: 90%; 
            position: relative; 
            max-height: 85vh;
            overflow-y: auto;
        }

        .close-btn { position: absolute; top: 10px; right: 15px; color: #888; cursor: pointer; font-size: 24px; }
        .size-selector { display: flex; gap: 10px; margin: 15px 0; }
        .size-box { border: 1px solid #333; padding: 6px 14px; cursor: pointer; font-size: 11px; }
        .size-box.selected, .size-box:hover { border-color: #fff; background: #222; }

        /* Cart Items Style */
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #222;
            font-size: 12px;
        }

        .cart-item-remove { color: #ff4d4d; cursor: pointer; font-weight: bold; margin-left: 10px; }

        footer { background-color: #000; border-top: 1px solid #222; text-align: center; padding: 30px; font-size: 10px; color: #444; letter-spacing: 2px; text-transform: uppercase; margin-top: 60px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Cross & Crown</div>
        <input type="text" class="search-box" id="search-input" placeholder="Cari outfit..." onkeyup="searchProduct()">
        <nav>
            <select class="currency-select" id="currency" onchange="changeCurrency()">
                <option value="IDR">IDR (Rp)</option>
                <option value="USD">USD ($)</option>
            </select>
            <button class="cart-trigger" onclick="openCartModal()">Cart (<span id="cart-count">0</span>)</button>
        </nav>
    </header>

    <section class="hero">
        <h1>Y2K Gothic Vault</h1>
        <p>Cyber-Gothic, Cyber-Y2K & Chrome Aesthetic Apparel</p>
    </section>

    <div class="container">
        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterCategory('all', this)">All</button>
            <button class="filter-btn" onclick="filterCategory('outerwear', this)">Outerwear</button>
            <button class="filter-btn" onclick="filterCategory('denim', this)">Denim & Bottoms</button>
            <button class="filter-btn" onclick="filterCategory('accessories', this)">Accessories</button>
        </div>

        <div class="product-grid" id="product-grid"></div>
    </div>

    <div class="modal-overlay" id="detail-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('detail-modal')">&times;</span>
            <h3 id="modal-title" style="font-family:'UnifrakturMaguntia'; font-size:26px;"></h3>
            <p id="modal-price" style="color:#888; margin-top:5px; font-size:14px;"></p>
            <hr style="border-color:#222; margin:15px 0;">
            <p id="modal-desc" style="font-size:12px; color:#aaa; line-height:1.6;"></p>
            
            <p style="font-size:10px; color:#666; margin-top:15px; letter-spacing:1px;">PILIH UKURAN:</p>
            <div class="size-selector">
                <div class="size-box" onclick="selectSize(this)">S</div>
                <div class="size-box selected" onclick="selectSize(this)">M</div>
                <div class="size-box" onclick="selectSize(this)">L</div>
                <div class="size-box" onclick="selectSize(this)">XL</div>
            </div>
            <button class="btn-buy" style="margin-top:10px;" onclick="addActiveToCart()">Tambah Ke Keranjang</button>
        </div>
    </div>

    <div class="modal-overlay" id="cart-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('cart-modal')">&times;</span>
            <h3 style="font-family:'UnifrakturMaguntia'; font-size:26px; margin-bottom:15px;">Vault Cart</h3>
            <div id="cart-items-list">
                <p style="font-size:12px; color:#666;">Keranjang masih kosong.</p>
            </div>
            <hr style="border-color:#222; margin:15px 0;">
            <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:14px; margin-bottom:15px;">
                <span>Total:</span>
                <span id="cart-total">Rp 0</span>
            </div>
            <button class="btn-buy" onclick="checkoutWA()">Checkout via WhatsApp</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Cross & Crown. Y2K Gothic Vault Collection.</p>
    </footer>
