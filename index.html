<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CROSS & CROWN | Gothic Streetwear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d0d;
            color: #e5e5e5;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        /* VIP Gate Overlay */
        #vip-gate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #vip-gate h2 {
            font-family: 'UnifrakturMaguntia', cursive;
            font-size: 40px;
            margin-bottom: 10px;
            color: #fff;
        }

        .pass-input {
            background: transparent;
            border: 1px solid #444;
            padding: 10px 15px;
            color: #fff;
            text-align: center;
            letter-spacing: 3px;
            margin: 20px 0;
            width: 250px;
        }

        /* Header / Nav */
        header {
            background-color: #000;
            border-bottom: 1px solid #222;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'UnifrakturMaguntia', cursive;
            font-size: 32px;
            color: #fff;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            color: #888;
            text-decoration: none;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s;
        }

        nav a:hover { color: #fff; }

        .currency-select {
            background: #000;
            color: #888;
            border: 1px solid #333;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
        }
