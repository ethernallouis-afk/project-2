<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CROSS & CROWN | Y2K Gothic Streetwear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0d0d0d; color: #e5e5e5; font-family: 'Montserrat', sans-serif; overflow-x: hidden; }

        header {
            background-color: #000;
            border-bottom: 1px solid #222;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-family: 'UnifrakturMaguntia', cursive; font-size: 32px; color: #fff; letter-spacing: 2px; }
        nav { display: flex; align-items: center; gap: 20px; }
        nav a { color: #888; text-decoration: none; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; cursor: pointer; }
        nav a:hover { color: #fff; }

        .currency-select { background: #000; color: #888; border: 1px solid #333; padding: 4px 8px; font-size: 11px; cursor: pointer; }

        .hero {
            height: 45vh;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=1200&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            border-bottom: 1px solid #222;
        }

        .hero h1 { font-family: 'UnifrakturMaguntia', cursive; font-size: 50px; color: #fff; }
        .hero p { letter-spacing: 4px; font-size: 11px; text-transform: uppercase; color: #888; margin-top: 5px; }

        .container { padding: 40px 5%; max-width: 1300px; margin: 0 auto; }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid #222;
            color: #666;
            padding: 8px 16px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: #fff;
            color: #fff;
            background: #141414;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: #111;
            border: 1px solid #222;
            padding: 15px;
            text-align: center;
            transition: border-color 0.3s;
        }

        .product-card:hover { border-color: #555; }

        .product-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            object-position: center;
            background-color: #1a1a1a;
            margin-bottom: 15px;
            border: 1px solid #222;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .product-img:hover { transform: scale(1.02); }
        .product-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; color: #fff; }
        .product-price { color: #888; font-size: 12px; margin-bottom: 15px; }

        .btn-buy {
            background-color: #fff;
            color: #000;
            border: none;
            padding: 10px 15px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }

        .btn-buy:hover { background-color: #333; color: #fff; }

        .modal-overlay {
